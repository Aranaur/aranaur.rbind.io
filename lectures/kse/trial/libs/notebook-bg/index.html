<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>notebook background</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fbfcff; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<script>
// Аркуш у клітинку. Рукописні позначки (оцінки, формули, «Д/З») з'являються,
// ніби їх пише ручка, а потім розсипаються на вузли мережі й зникають.
(() => {
  const cv = document.getElementById('bg');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const CELL = 28, MARGIN_X = 58;
  const INK = '#1D3FBF', RED = '#D7263D', NODE = ['#0038FF', '#05006B', '#00A3D9'];
  const WORDS = [
    { t: 'Д/З', c: INK }, { t: 'x² + 2x = 0', c: INK }, { t: '12', c: RED },
    { t: '✓', c: RED }, { t: 'Класна робота', c: INK }, { t: 'a² + b² = c²', c: INK },
    { t: '10/12', c: RED }, { t: 'с. 42, впр. 3', c: INK }, { t: 'S = v·t', c: INK },
    { t: 'Тема:', c: INK }, { t: '1918', c: INK }, { t: '√49 = 7', c: INK },
    { t: 'H₂O', c: INK }, { t: 'молодець!', c: RED }, { t: 'π ≈ 3,14', c: INK },
    { t: 'Твір-роздум', c: INK }, { t: '?', c: INK }, { t: 'перевірити', c: RED },
  ];
  const FONT = '"Caveat", "Segoe Print", "Comic Sans MS", cursive';
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const rnd = (a, b) => a + Math.random() * (b - a);

  let W, H, DPR, paper, items = [], last = 0;
  const off = document.createElement('canvas');
  const octx = off.getContext('2d', { willReadFrequently: true });

  function drawPaper() {
    paper = document.createElement('canvas');
    paper.width = W * DPR; paper.height = H * DPR;
    const p = paper.getContext('2d');
    p.setTransform(DPR, 0, 0, DPR, 0, 0);
    p.fillStyle = '#fbfcff'; p.fillRect(0, 0, W, H);
    p.strokeStyle = 'rgba(0, 56, 255, 0.10)'; p.lineWidth = 1;
    for (let x = 0.5; x < W; x += CELL) { p.beginPath(); p.moveTo(x, 0); p.lineTo(x, H); p.stroke(); }
    for (let y = 0.5; y < H; y += CELL) { p.beginPath(); p.moveTo(0, y); p.lineTo(W, y); p.stroke(); }
    p.strokeStyle = 'rgba(215, 38, 61, 0.45)'; p.lineWidth = 2;
    p.beginPath(); p.moveTo(MARGIN_X, 0); p.lineTo(MARGIN_X, H); p.stroke();
  }

  // Точки, з яких складається напис: беремо пікселі з невидимого полотна.
  function sample(text, size) {
    octx.font = `700 ${size}px ${FONT}`;
    const w = Math.ceil(octx.measureText(text).width) + 8, h = Math.ceil(size * 1.4);
    off.width = w; off.height = h;
    octx.font = `700 ${size}px ${FONT}`;
    octx.textBaseline = 'middle'; octx.fillStyle = '#000';
    octx.fillText(text, 4, h / 2);
    const data = octx.getImageData(0, 0, w, h).data, pts = [];
    for (let y = 0; y < h; y += 3) for (let x = 0; x < w; x += 3) if (data[(y * w + x) * 4 + 3] > 140) pts.push([x - 4, y - h / 2]);
    for (let i = pts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pts[i], pts[j]] = [pts[j], pts[i]]; }
    return { w, pts: pts.slice(0, Math.max(5, Math.min(16, Math.round(pts.length / 18)))) };
  }

  function spawn(now) {
    // На великих екранах написи більші, щоб їх було видно із зали
    const g = pick(WORDS), size = Math.round(rnd(28, 50) * Math.max(1, W / 1500));
    const s = sample(g.t, size);
    for (let k = 0; k < 12; k++) {
      const x = rnd(MARGIN_X + 20, Math.max(MARGIN_X + 40, W - s.w - 20));
      const y = rnd(40, H - 40);
      const clash = items.some(o => Math.abs(o.x - x) < Math.max(o.w, s.w) + 30 && Math.abs(o.y - y) < 70);
      if (!clash || k === 11) {
        items.push({
          text: g.t, color: g.c, size, w: s.w, x, y,
          rot: rnd(-0.08, 0.06), alpha: rnd(0.35, 0.6),
          t0: now, write: rnd(1100, 1900), hold: rnd(2200, 4200), morph: 1600, drift: rnd(2600, 4200),
          nodes: s.pts.map(([px, py]) => ({ ox: px, oy: py, vx: rnd(-0.18, 0.18), vy: rnd(-0.18, 0.18), c: pick(NODE) })),
        });
        return;
      }
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawPaper();
    items = [];
  }

  function drawItem(it, now) {
    const t = now - it.t0, tw = it.write, th = tw + it.hold, tm = th + it.morph, td = tm + it.drift;
    ctx.save();
    ctx.translate(it.x, it.y); ctx.rotate(it.rot);
    // 1) пишемо: текст відкривається зліва направо
    if (t < tm) {
      const shown = Math.min(1, t / tw);
      const fade = t < th ? 1 : 1 - (t - th) / it.morph;
      ctx.save();
      ctx.beginPath(); ctx.rect(-6, -it.size, (it.w + 6) * shown, it.size * 2); ctx.clip();
      ctx.globalAlpha = it.alpha * fade;
      ctx.fillStyle = it.color;
      ctx.font = `700 ${it.size}px ${FONT}`;
      ctx.textBaseline = 'middle';
      ctx.fillText(it.text, 0, 0);
      ctx.restore();
    }
    // 2) напис розсипається на вузли, вузли з'єднуються лініями й розлітаються
    if (t > th) {
      const k = Math.min(1, (t - th) / it.morph);
      const fadeOut = t > tm ? 1 - (t - tm) / it.drift : 1;
      const life = t - th;
      const pos = it.nodes.map(n => [n.ox + n.vx * life * 0.06 * k, n.oy + n.vy * life * 0.06 * k]);
      ctx.globalAlpha = 0.55 * k * Math.max(0, fadeOut);
      ctx.lineWidth = 1;
      for (let i = 0; i < pos.length; i++) for (let j = i + 1; j < pos.length; j++) {
        const d = Math.hypot(pos[i][0] - pos[j][0], pos[i][1] - pos[j][1]);
        const L = 46 * Math.max(1, it.size / 40);
        if (d < L) { ctx.strokeStyle = `rgba(0, 56, 255, ${0.5 * (1 - d / L)})`; ctx.beginPath(); ctx.moveTo(pos[i][0], pos[i][1]); ctx.lineTo(pos[j][0], pos[j][1]); ctx.stroke(); }
      }
      for (let i = 0; i < pos.length; i++) {
        ctx.fillStyle = it.nodes[i].c;
        ctx.beginPath(); ctx.arc(pos[i][0], pos[i][1], (2.6 * k + 0.6) * Math.max(1, it.size / 40), 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
    return t < td;
  }

  function frame(now) {
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(paper, 0, 0, W, H);
    const target = Math.max(4, Math.min(9, Math.round((W * H) / 150000)));
    if (items.length < target && now - last > 650) { spawn(now); last = now; }
    items = items.filter(it => drawItem(it, now));
    requestAnimationFrame(frame);
  }

  function still() {
    ctx.drawImage(paper, 0, 0, W, H);
    const now = 1e9;
    for (let i = 0; i < 6; i++) spawn(now - 2500);
    items.forEach(it => drawItem(it, now));
  }

  // Фон інтерактивний, тож клік переводить фокус в iframe і стрілки
  // перестають гортати слайди. Повертаємо фокус презентації
  // і самі передаємо їй клавіші навігації.
  const host = () => { try { return window.parent !== window ? window.parent : null; } catch (e) { return null; } };
  const giveBack = () => { const h = host(); if (h) try { h.focus(); } catch (e) {} };
  addEventListener('mousedown', () => setTimeout(giveBack, 0));
  addEventListener('focus', giveBack);
  addEventListener('keydown', e => {
    const h = host(); let R;
    try { R = h && h.Reveal; } catch (err) { R = null; }
    if (!R) return;
    const next = ['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'n', 'N'];
    const prev = ['ArrowLeft', 'ArrowUp', 'PageUp', 'p', 'P', 'Backspace'];
    if (next.includes(e.key)) { R.next(); e.preventDefault(); }
    else if (prev.includes(e.key)) { R.prev(); e.preventDefault(); }
    giveBack();
  });

  addEventListener('resize', () => { resize(); if (reduce) still(); });
  const start = () => { resize(); if (reduce) still(); else requestAnimationFrame(frame); };
  // Чекаємо на рукописний шрифт (не довше 1,5 с: без інтернету підійде запасний).
  const fontReady = document.fonts && document.fonts.load ? document.fonts.load('700 32px "Caveat"').catch(() => {}) : Promise.resolve();
  Promise.race([fontReady, new Promise(r => setTimeout(r, 1500))]).then(start, start);
})();
</script>
</body>
</html>
