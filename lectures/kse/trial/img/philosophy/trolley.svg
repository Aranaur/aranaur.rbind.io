<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <g id="person">
      <circle cx="0" cy="-34" r="9"/>
      <rect x="-7" y="-24" width="14" height="26" rx="6"/>
    </g>
  </defs>
  <!-- рейки -->
  <g fill="none" stroke="#05006B" stroke-width="6" stroke-linecap="round">
    <path d="M40 230 H360"/>
    <path d="M360 230 C430 230 460 130 540 130 H860"/>
    <path d="M360 230 C430 230 460 330 540 330 H860"/>
  </g>
  <g stroke="#05006B" stroke-width="3" opacity=".35">
    <path d="M60 220 v20 M90 220 v20 M120 220 v20 M150 220 v20 M180 220 v20 M210 220 v20 M240 220 v20 M270 220 v20 M300 220 v20 M330 220 v20"/>
  </g>
  <!-- вагонетка -->
  <g transform="translate(110 186)">
    <rect x="0" y="0" width="120" height="44" rx="8" fill="#0038FF"/>
    <circle cx="28" cy="48" r="10" fill="#05006B"/>
    <circle cx="92" cy="48" r="10" fill="#05006B"/>
    <text x="60" y="29" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">→</text>
  </g>
  <!-- стрілка (важіль) -->
  <g transform="translate(372 300)">
    <rect x="-24" y="0" width="48" height="12" rx="4" fill="#05006B"/>
    <line x1="0" y1="4" x2="26" y2="-46" stroke="#FB4F01" stroke-width="7" stroke-linecap="round"/>
    <circle cx="26" cy="-46" r="10" fill="#FB4F01"/>
    <text x="0" y="40" text-anchor="middle" font-size="20" fill="#05006B">важіль</text>
  </g>
  <!-- п'ятеро на основній колії -->
  <g fill="#05006B">
    <use href="#person" x="640" y="122"/>
    <use href="#person" x="675" y="122"/>
    <use href="#person" x="710" y="122"/>
    <use href="#person" x="745" y="122"/>
    <use href="#person" x="780" y="122"/>
  </g>
  <text x="710" y="80" text-anchor="middle" font-size="24" font-weight="700" fill="#05006B">5 людей</text>
  <!-- один на бічній колії -->
  <g fill="#FB4F01">
    <use href="#person" x="710" y="322"/>
  </g>
  <text x="710" y="380" text-anchor="middle" font-size="24" font-weight="700" fill="#FB4F01">1 людина</text>
</svg>
